# Whole stack with one command:  docker compose up -d --build
#   http://localhost:8080          SPA + API gateway (/api/auth, /api/pos, /api/finance)
#   http://localhost:8001/8002/8003 direct service ports (for testing /internal/* with X-Service-Key)
#
# No secrets live in this repo. `secrets-init` runs first and generates every secret (APP_KEYs, JWT secret,
# service key, MySQL passwords) into the `secrets` volume, which the other containers mount read-only as
# /run/secrets. To pin your own values, set them in a gitignored .env (see .env.example).

x-secrets-mount: &secrets-mount secrets:/run/secrets:ro

x-service-env: &service-env
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  CACHE_STORE: file
  DB_CONNECTION: mysql
  DB_PORT: "3306"
  SERVICE_HTTP_TIMEOUT: "3"
  AUTH_SERVICE_URL: http://auth-service:8000
  POS_SERVICE_URL: http://pos-service:8000
  FINANCE_SERVICE_URL: http://finance-service:8000
  INTERNAL_API_KEY_FILE: /run/secrets/internal_api_key

x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  command: ["--default-time-zone=+07:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat $$MYSQL_ROOT_PASSWORD_FILE)\" --silent"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s

services:
  # ---------- secrets (runs once, then exits) ----------
  secrets-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "/init-secrets.sh"]
    environment:
      # Optional overrides from .env; empty means "generate once and keep".
      APP_KEY_AUTH: ${APP_KEY_AUTH:-}
      APP_KEY_POS: ${APP_KEY_POS:-}
      APP_KEY_FINANCE: ${APP_KEY_FINANCE:-}
      JWT_SECRET: ${JWT_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DB_AUTH_ROOT_PASSWORD: ${DB_AUTH_ROOT_PASSWORD:-}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:-}
      DB_POS_ROOT_PASSWORD: ${DB_POS_ROOT_PASSWORD:-}
      DB_POS_PASSWORD: ${DB_POS_PASSWORD:-}
      DB_FINANCE_ROOT_PASSWORD: ${DB_FINANCE_ROOT_PASSWORD:-}
      DB_FINANCE_PASSWORD: ${DB_FINANCE_PASSWORD:-}
    volumes:
      - ./scripts/init-secrets.sh:/init-secrets.sh:ro
      - secrets:/secrets

  # ---------- databases (one isolated MySQL per service) ----------
  db_auth:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_auth_root_password
      MYSQL_DATABASE: db_auth
      MYSQL_USER: auth
      MYSQL_PASSWORD_FILE: /run/secrets/db_auth_password
    volumes: [db_auth:/var/lib/mysql, *secrets-mount]
    depends_on:
      secrets-init: { condition: service_completed_successfully }

  db_pos:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_pos_root_password
      MYSQL_DATABASE: db_pos
      MYSQL_USER: pos
      MYSQL_PASSWORD_FILE: /run/secrets/db_pos_password
    volumes: [db_pos:/var/lib/mysql, *secrets-mount]
    depends_on:
      secrets-init: { condition: service_completed_successfully }

  db_finance:
    <<: *mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_finance_root_password
      MYSQL_DATABASE: db_finance
      MYSQL_USER: finance
      MYSQL_PASSWORD_FILE: /run/secrets/db_finance_password
    volumes: [db_finance:/var/lib/mysql, *secrets-mount]
    depends_on:
      secrets-init: { condition: service_completed_successfully }

  # ---------- backend services (Laravel 13 on FrankenPHP) ----------
  # docker/entrypoint.sh exports every *_FILE variable below as the plain variable before Laravel boots.
  auth-service:
    build: ./services/auth
    restart: unless-stopped
    environment:
      <<: *service-env
      APP_NAME: auth-service
      APP_KEY_FILE: /run/secrets/app_key_auth
      DB_HOST: db_auth
      DB_DATABASE: db_auth
      DB_USERNAME: auth
      DB_PASSWORD_FILE: /run/secrets/db_auth_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "604800"
      # Test accounts (*@demo.test, see README). Set SEED_DEMO_USERS=false in .env on any public deployment;
      # existing demo accounts are then deactivated on the next start.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      # Optional own superadmin, created once if the email does not exist yet.
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes: [*secrets-mount]
    depends_on:
      db_auth: { condition: service_healthy }
    ports: ["8001:8000"]
    healthcheck: &http-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  pos-service:
    build: ./services/pos
    restart: unless-stopped
    environment:
      <<: *service-env
      APP_NAME: pos-service
      APP_KEY_FILE: /run/secrets/app_key_pos
      DB_HOST: db_pos
      DB_DATABASE: db_pos
      DB_USERNAME: pos
      DB_PASSWORD_FILE: /run/secrets/db_pos_password
      TAX_RATE: ${TAX_RATE:-0.11}
    volumes: [*secrets-mount]
    depends_on:
      db_pos: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    ports: ["8002:8000"]
    healthcheck: *http-health

  finance-service:
    build: ./services/finance
    restart: unless-stopped
    environment:
      <<: *service-env
      APP_NAME: finance-service
      APP_KEY_FILE: /run/secrets/app_key_finance
      DB_HOST: db_finance
      DB_DATABASE: db_finance
      DB_USERNAME: finance
      DB_PASSWORD_FILE: /run/secrets/db_finance_password
    volumes: [*secrets-mount]
    depends_on:
      db_finance: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    ports: ["8003:8000"]
    healthcheck: *http-health

  # ---------- frontend + gateway ----------
  frontend:
    build: ./frontend
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1" # template gets the container DNS server (runtime re-resolution)
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - auth-service
      - pos-service
      - finance-service
      - frontend
    ports: ["${GATEWAY_PORT:-8080}:80"]

volumes:
  db_auth:
  db_pos:
  db_finance:
  secrets:
